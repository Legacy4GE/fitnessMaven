---
- name: Configure fitnessMaven app server
  hosts: app
  become: true
  vars:
    app_user: fitnessmaven
    app_dir: /opt/fitnessmaven
    venv_dir: /opt/fitnessmaven/venv

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install system dependencies
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - libpq-dev
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Create Python virtual environment
      command: python3 -m venv {{ venv_dir }}
      args:
        creates: "{{ venv_dir }}/bin/activate"
      become_user: "{{ app_user }}"

    - name: Install Python packages
      pip:
        name:
          - fastapi
          - uvicorn[standard]
          - sqlalchemy
          - alembic
          - psycopg2-binary
          - python-jose[cryptography]
          - passlib[bcrypt]
          - pydantic-settings
          - python-multipart
        virtualenv: "{{ venv_dir }}"
      become_user: "{{ app_user }}"

    - name: Create environment file
      template:
        src: env.j2
        dest: "{{ app_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"

    - name: Create systemd service for fitnessMaven
      copy:
        dest: /etc/systemd/system/fitnessmaven.service
        content: |
          [Unit]
          Description=fitnessMaven API
          After=network.target

          [Service]
          User={{ app_user }}
          WorkingDirectory={{ app_dir }}
          EnvironmentFile={{ app_dir }}/.env
          ExecStart={{ venv_dir }}/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
        mode: "0644"

    - name: Enable and start fitnessMaven service
      systemd:
        name: fitnessmaven
        enabled: true
        daemon_reload: true
        state: started

    - name: Configure nginx reverse proxy
      copy:
        dest: /etc/nginx/sites-available/fitnessmaven
        content: |
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
        mode: "0644"

    - name: Enable nginx site
      file:
        src: /etc/nginx/sites-available/fitnessmaven
        dest: /etc/nginx/sites-enabled/fitnessmaven
        state: link

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Restart nginx
      systemd:
        name: nginx
        state: restarted
